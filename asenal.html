<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>军火库</title>
        <script src="js/public/three/three.js" data-ke-src="public/three/three.js"></script>
        <script src="js/public/three/stats.min.js"></script>
        <script src="js/public/three/TrackballControls.js"></script>
        <script src="js/public/three/OrbitControls.js"></script>
        <script src="js/public/three/Lensflare.js"></script>
        <script src="js/public/three/loaders/FBXLoader.js"></script>
        <script src="js/public/three/loaders/MTLLoader.js"></script>
        <script src="js/public/three/loaders/OBJLoader.js"></script>
        <script src="js/public/three/loaders/TGALoader.js"></script>
        <script src="js/public/three/loaders/DDSLoader.js"></script>
        <script src="js/public/libs/inflate.min.js"></script>
        <style type="text/css">
            div#canvas-frame {
                border: none;
                cursor: pointer;
                width: 100%;
                height: 80%;
                background-color: #EEEEEE;
            }

        </style>
        <style>
            #modelOptions {
                display: block;
                margin-top: 10px;
                text-align: center;
            }
            #modelOptions label img {
                border: 2px solid transparent; /* 默认无边框 */
                border-radius: 5px; /* 可选：圆角边框 */
                transition: border-color 0.3s; /* 平滑过渡效果 */
            }

            #modelOptions label input:checked + img {
                border: 5px solid #007BFF; /* 选中状态的外框颜色 */
            }

            #modelOptions label img:hover {
                border-color: #555; /* 鼠标悬停时的边框颜色 */
            }
        </style>
    </head>

    <body onkeypress="game.onKeyPress.call(game, event)">
        <script type="module" src="js/demos/asenal.js"></script>
        <script type="module" >
            import {Asenal} from "./js/demos/asenal.js";

            var game;
            document.addEventListener("DOMContentLoaded", function() {
                game = new Asenal(); 
                window.game = game;
            });
        </script>
        <div id="canvas-frame"></div>
        <div id="modelOptions" style="display:block; margin-top:10px;">
        <form id="modelForm">
            <label>
                <input type="radio" name="model" value="J15A" checked style="display:none;">
                <img src="./model/Fighters/J-15A/J-15_diffuse.jpg" alt="J15A" title="J15A" style="width:50px; height:50px; cursor:pointer;">
            </label>
            <label>
                <input type="radio" name="model" value="XiLou" style="display:none;">
                <img src="./model/Fighters/FC-31/FC-31.jpg" alt="XiLou" title="XiLou" style="width:50px; height:50px; cursor:pointer;">
            </label>
            <label>
                <input type="radio" name="model" value="SU27" style="display:none;">
                <img src="./model/Fighters/Su-27/Su-27_diffuse.png" alt="SU27" title="SU27" style="width:50px; height:50px; cursor:pointer;">
            </label>
        </form>
    </div>
    </body>
</html>
